name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm web:format:check
      - name: Lint, types, and builds
        run: pnpm web:check
      - name: Design and production tests
        run: pnpm design:check

  server:
    name: .NET
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Native AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - run: pnpm install --frozen-lockfile
      - run: dotnet restore platform/Mosaic.slnx
      - name: Formatting
        run: dotnet format platform/Mosaic.slnx --verify-no-changes --no-restore
      - run: dotnet build platform/Mosaic.slnx --configuration Release --no-restore
      - run: dotnet test --solution platform/Mosaic.slnx --configuration Release --no-build --no-restore
      - name: Build admin assets
        run: pnpm build:admin-assets
      - name: Publish Linux Native AOT server
        run: dotnet publish platform/apps/server/Mosaic.Server.csproj --configuration Release --runtime linux-x64 -p:PublishAot=true -p:ILLinkTreatWarningsAsErrors=true -p:IlcTreatWarningsAsErrors=true --output publish/ci
      - name: Published server smoke test
        run: python3 scripts/smoke-server.py publish/ci/Mosaic.Server

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platform/apps/companion/src-tauri/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'platform/apps/companion/src-tauri/Cargo.lock') }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mosaic/companion build
      - name: Formatting
        run: cargo fmt --check --manifest-path platform/apps/companion/src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --all-targets --manifest-path platform/apps/companion/src-tauri/Cargo.toml -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets --manifest-path platform/apps/companion/src-tauri/Cargo.toml

  generated:
    name: Generated code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mosaic/protocols lint
      - name: Remove previous bindings to detect obsolete generated files
        run: |
          python3 - <<'PY'
          import shutil
          for path in [
              'firmware/components/device_protos/generated',
              'platform/apps/server/Generated/DeviceProtocol',
          ]:
              shutil.rmtree(path)
          PY
      - run: pnpm generate-protos
      - name: Check committed bindings, including new files
        run: |
          python3 - <<'PY'
          import subprocess
          paths = [
              'platform/packages/protocols',
              'firmware/components/device_protos/generated',
              'platform/apps/server/Generated/DeviceProtocol',
          ]
          subprocess.run(['git', '--no-pager', 'diff', '--exit-code', '--', *paths], check=True)
          changes = subprocess.check_output([
              'git', 'status', '--porcelain', '--untracked-files=all', '--', *paths,
          ], text=True)
          if changes:
              raise SystemExit('Generated bindings are not committed:\n' + changes)
          PY
      - name: Offline token generator tests
        run: pnpm --filter @mosaic/tokens test

  firmware-host:
    name: Firmware host checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
          python -m pip install clang-format==23.1.2
          g++-14 --version
          clang-format --version
      - name: Firmware formatting
        run: node scripts/format-firmware.mjs --check
      - name: Firmware host tests
        # Runs every tracked firmware tests/run.py and tests/*.test.mjs, plus the IDF wrapper's lock tests.
        run: python3 scripts/firmware_host_tests.py

  firmware-preview:
    name: Firmware preview (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev g++-14 && echo "CXX=g++-14" >> "$GITHUB_ENV"
      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2
      - name: Install SDL2 (Windows)
        if: runner.os == 'Windows'
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install sdl2:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
      - name: Build firmware preview
        run: python firmware/preview/run.py --build-only

  firmware-build:
    name: Firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Official espressif/idf:v5.5.4, pinned to its multi-platform image digest.
      image: espressif/idf@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust the mounted checkout in the container
        # Checkout configures a temporary HOME; run steps need their own trust entry.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build ESP32-P4 firmware
        run: |
          source /opt/esp/idf/export.sh
          python -m pip install idf-component-manager==2.5.2
          idf.py --version
          node --version
          python3 scripts/firmware.py -B build/ci -D SDKCONFIG=build/ci/sdkconfig build
      - name: Check normal firmware has no debug triggers
        # MOSAIC_DEBUG_TRIGGERS defaults OFF; its code must not reach the default image.
        run: |
          source /opt/esp/idf/export.sh
          riscv32-esp-elf-nm -C firmware/build/ci/device_firmware.elf > firmware/build/ci/symbols.txt
          if grep -E 'debug_triggers::|esp_console_new_repl' firmware/build/ci/symbols.txt; then
            echo "Debug trigger code found in the normal firmware image" >&2
            exit 1
          fi
      - name: Check dependency lock stayed pinned and portable
        run: git --no-pager diff --exit-code -- firmware/dependencies.lock
