syntax = "proto3";

package mosaic.device.v1;

import "nanopb.proto";

// Each WebSocket binary message holds exactly one envelope. See the wiki's
// Device Connection Protocol for ordering and receiver-enforced field rules.
message DeviceToBackendEnvelope {
  oneof payload {
    // Never renumber: a future server needs it to tell an old device to update.
    DeviceConnect connect = 1;
  }
}

message BackendToDeviceEnvelope {
  oneof payload {
    PairingPending pairing_pending = 1;
    DevicePaired paired = 2;
    // Never renumber: a future server needs it to tell an old device to update.
    ConnectionRejected rejected = 3;
  }
}

// First frame from the device on every connection.
message DeviceConnect {
  // Wire protocol version. Currently 1; zero is unsupported. Never renumber.
  uint32 protocol_version = 1;
  // 32 random bytes the device generated for this server. The server stores
  // only its SHA-256 hash.
  bytes auth_secret = 2 [(nanopb).max_size = 32, (nanopb).fixed_length = true];
}

// The credential is not paired yet. The code is eight uppercase characters
// without the dash; the device displays it as XXXX-XXXX.
message PairingPending {
  string code = 1 [(nanopb).max_size = 9];
  uint32 expires_in_seconds = 2;
}

// The credential is paired; application frames are now allowed.
message DevicePaired {}

enum ConnectionRejectReason {
  CONNECTION_REJECT_REASON_UNSPECIFIED = 0;
  CONNECTION_REJECT_REASON_MALFORMED_REQUEST = 1;
  CONNECTION_REJECT_REASON_UNSUPPORTED_VERSION = 2;
  CONNECTION_REJECT_REASON_CREDENTIAL_REVOKED = 3;
  CONNECTION_REJECT_REASON_SERVER_BUSY = 4;
}

// The server will close the connection after this frame. Never renumber.
message ConnectionRejected {
  ConnectionRejectReason reason = 1;
}
