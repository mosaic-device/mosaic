syntax = "proto3";

package mosaic.device.v1;

import "nanopb.proto";

enum NotificationPriority {
  NOTIFICATION_PRIORITY_UNSPECIFIED = 0;
  NOTIFICATION_PRIORITY_NORMAL = 1;
  NOTIFICATION_PRIORITY_HIGH = 2;
}

enum DaemonActionId {
  DAEMON_ACTION_UNSPECIFIED = 0;
  OPEN_URL = 1;
  TOGGLE_MUTE = 2;
  OPEN_IDE = 3;
  LOCK_SCREEN = 4;
}

// First frame from the device on every connection. See the wiki's
// Device Connection Protocol for ordering and receiver-enforced field rules.
message DeviceConnect {
  string mac_address = 1 [(nanopb).max_size = 18];
  string auth_secret = 2 [(nanopb).max_size = 64];
  // Wire protocol version. Currently 1; zero is unsupported. Never renumber.
  uint32 protocol_version = 3;
}

enum ConnectionRejectReason {
  CONNECTION_REJECT_REASON_UNSPECIFIED = 0;
  CONNECTION_REJECT_REASON_MALFORMED_REQUEST = 1;
  CONNECTION_REJECT_REASON_UNSUPPORTED_VERSION = 2;
  CONNECTION_REJECT_REASON_CREDENTIAL_REVOKED = 3;
  CONNECTION_REJECT_REASON_SERVER_BUSY = 4;
}

// The credential is not paired yet. The code is eight uppercase characters
// without the dash; the device displays it as XXXX-XXXX.
message PairingPending {
  string code = 1 [(nanopb).max_size = 9];
  uint32 expires_in_seconds = 2;
}

// The credential is paired; application frames are now allowed.
message DevicePaired {}

// The server will close the connection after this frame. Never renumber.
message ConnectionRejected {
  ConnectionRejectReason reason = 1;
}

message NotificationAction {
  string id = 1 [(nanopb).max_size = 96];
  string label = 2 [(nanopb).max_size = 48];
  bool requires_confirmation = 3;
  bool destructive = 4;
}

message AiSummaryNotification {
  string title = 1 [(nanopb).max_size = 64];
  string summary_text = 2 [(nanopb).max_size = 512];
  NotificationPriority priority = 3;
  string notification_id = 4 [(nanopb).max_size = 64];
  repeated NotificationAction actions = 5 [(nanopb).max_count = 4];
}

message DeviceTelemetry {
  float lux = 1;
  int32 encoder_count = 2;
  bool button_pressed = 3;
}

message DeviceActionTrigger {
  DaemonActionId action_id = 1;
  string payload = 2 [(nanopb).max_size = 256];
}

message IntegrationActionTrigger {
  string notification_id = 1 [(nanopb).max_size = 64];
  string action_id = 2 [(nanopb).max_size = 96];
}

message IntegrationActionResult {
  string notification_id = 1 [(nanopb).max_size = 64];
  string action_id = 2 [(nanopb).max_size = 96];
  bool success = 3;
  string message = 4 [(nanopb).max_size = 128];
}

message DeviceToBackendEnvelope {
  string request_id = 1 [(nanopb).max_size = 64];

  oneof payload {
    DeviceTelemetry telemetry = 2;
    DeviceActionTrigger daemon_action = 3;
    IntegrationActionTrigger integration_action = 4;
    DeviceConnect connect = 5;
  }
}

message BackendToDeviceEnvelope {
  string request_id = 1 [(nanopb).max_size = 64];

  oneof payload {
    AiSummaryNotification notification = 2;
    IntegrationActionResult action_result = 3;
    PairingPending pairing_pending = 4;
    DevicePaired paired = 5;
    ConnectionRejected rejected = 6;
  }
}
