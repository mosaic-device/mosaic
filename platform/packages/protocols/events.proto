syntax = "proto3";

package mosaic.device.v1;

import "nanopb.proto";

// Each WebSocket binary message holds exactly one envelope. See the wiki's
// Device Connection Protocol and Notification Delivery Protocol for ordering
// and receiver-enforced field rules.
message DeviceToBackendEnvelope {
  oneof payload {
    // Never renumber: a future server needs it to tell an old device to update.
    DeviceConnect connect = 1;
    NotificationReceipt notification_receipt = 2;
  }
}

message BackendToDeviceEnvelope {
  oneof payload {
    PairingPending pairing_pending = 1;
    DevicePaired paired = 2;
    // Never renumber: a future server needs it to tell an old device to update.
    ConnectionRejected rejected = 3;
    Notification notification = 4;
  }
}

// First frame from the device on every connection.
message DeviceConnect {
  // Wire protocol version. Currently 1; zero is unsupported. Never renumber.
  uint32 protocol_version = 1;
  // 32 random bytes the device generated for this server. The server stores
  // only its SHA-256 hash.
  bytes auth_secret = 2 [(nanopb).max_size = 32, (nanopb).fixed_length = true];
}

// The credential is not paired yet. The code is eight uppercase characters
// without the dash; the device displays it as XXXX-XXXX.
message PairingPending {
  string code = 1 [(nanopb).max_size = 9];
  uint32 expires_in_seconds = 2;
}

// The credential is paired; application frames are now allowed.
message DevicePaired {}

enum ConnectionRejectReason {
  CONNECTION_REJECT_REASON_UNSPECIFIED = 0;
  CONNECTION_REJECT_REASON_MALFORMED_REQUEST = 1;
  CONNECTION_REJECT_REASON_UNSUPPORTED_VERSION = 2;
  CONNECTION_REJECT_REASON_CREDENTIAL_REVOKED = 3;
  CONNECTION_REJECT_REASON_SERVER_BUSY = 4;
}

// The server will close the connection after this frame. Never renumber.
message ConnectionRejected {
  ConnectionRejectReason reason = 1;
}

enum NotificationPriority {
  NOTIFICATION_PRIORITY_UNSPECIFIED = 0;
  NOTIFICATION_PRIORITY_NORMAL = 1;
  // Interrupts even in focus mode.
  NOTIFICATION_PRIORITY_HIGH = 2;
}

// Sent only after paired. String limits count UTF-8 bytes, including nanopb's
// terminating NUL; the server truncates text to fit before sending.
message Notification {
  // Chosen by the server, unique per device, and kept when resent.
  string id = 1 [(nanopb).max_size = 64];
  NotificationPriority priority = 2;
  // A display label such as "GitHub". The device never branches on it.
  string source = 3 [(nanopb).max_size = 32];
  string title = 4 [(nanopb).max_size = 128];
  string text = 5 [(nanopb).max_size = 1024];
  // When the event happened, in Unix seconds, not when it was sent.
  int64 occurred_at = 6;
}

enum NotificationReceiptStatus {
  NOTIFICATION_RECEIPT_STATUS_UNSPECIFIED = 0;
  // New, and now in the device's list.
  NOTIFICATION_RECEIPT_STATUS_STORED = 1;
  // The device already held a notification with this ID.
  NOTIFICATION_RECEIPT_STATUS_DUPLICATE = 2;
  // Decoded, but a field breaks the rules. The server must not resend it.
  NOTIFICATION_RECEIPT_STATUS_INVALID = 3;
}

// The device's reply to each notification, sent once it is stored and before
// it is shown.
message NotificationReceipt {
  string notification_id = 1 [(nanopb).max_size = 64];
  NotificationReceiptStatus status = 2;
}
